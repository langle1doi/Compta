# Platform RBAC: one domain, "platform". Deny by default, no wildcards.
# p = role, domain, resource, action       e.g. role:<id>, platform, tenant, manage
# g = admin, role, domain

[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub, r.dom) && r.dom == p.dom && r.obj == p.obj && r.act == p.act
